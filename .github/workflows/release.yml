name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Stamp assembly version from tag
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "Tag '$ver' is not a x.y.z version" }
          $csproj = "RenoDXCommander/RenoDXCommander.csproj"
          (Get-Content $csproj -Raw) `
            -replace '<AssemblyVersion>.*</AssemblyVersion>', "<AssemblyVersion>$ver.0</AssemblyVersion>" `
            -replace '<FileVersion>.*</FileVersion>', "<FileVersion>$ver.0</FileVersion>" |
            Set-Content $csproj -NoNewline
          Write-Host "Version stamped: $ver.0"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build portable (self-contained)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Compile per-user installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "SalsaNeural.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: SalsaNeural ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/SalsaNeural-Portable.zip
            dist/SalsaNeural-Setup.exe
