name: Build check

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RenoDXCommander/RenoDXCommander.csproj -r win-x64

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish RenoDXCommander/RenoDXCommander.csproj
          -c Release -r win-x64
          -p:PublishSingleFile=true -p:Platform=x64
          --self-contained true
          -o dist/SalsaNeural

      - name: Verify publish output
        shell: pwsh
        run: |
          $exe = "dist/SalsaNeural/SalsaNeural.exe"
          if (!(Test-Path $exe)) { throw "Missing $exe" }
          Write-Host "OK: $exe"
